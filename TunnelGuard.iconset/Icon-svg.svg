<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>

    <!-- App background gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2456"/>
      <stop offset="100%" stop-color="#0d1330"/>
    </linearGradient>

    <!-- Shield left half gradient -->
    <linearGradient id="shieldLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2756d4"/>
      <stop offset="100%" stop-color="#1a3fa8"/>
    </linearGradient>

    <!-- Shield right half gradient -->
    <linearGradient id="shieldRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a90f5"/>
      <stop offset="100%" stop-color="#2f6de0"/>
    </linearGradient>

    <!-- Shield stroke gradient -->
    <linearGradient id="shieldStroke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#90c4ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#5090dd" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Top gloss gradient -->
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Lock body gradient -->
    <linearGradient id="lockGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#dce8ff" stop-opacity="1"/>
    </linearGradient>

    <!-- Shackle gradient -->
    <linearGradient id="shackleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ccdeff" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Shield glow filter -->
    <filter id="shieldGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Drop shadow for lock -->
    <filter id="lockShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0a1535" flood-opacity="0.5"/>
    </filter>

    <!-- Clip for left half of shield -->
    <clipPath id="leftHalf">
      <rect x="0" y="0" width="512" height="1024"/>
    </clipPath>

    <!-- Clip for right half of shield -->
    <clipPath id="rightHalf">
      <rect x="512" y="0" width="512" height="1024"/>
    </clipPath>

    <!-- Rounded rect clip for bg -->
    <clipPath id="bgClip">
      <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224"/>
    </clipPath>

  </defs>

  <!-- ── Background ── -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224" fill="url(#bgGrad)"/>

  <!-- Subtle radial center glow on bg -->
  <radialGradient id="bgGlow" cx="50%" cy="40%" r="55%">
    <stop offset="0%" stop-color="#2040a0" stop-opacity="0.5"/>
    <stop offset="100%" stop-color="#0d1330" stop-opacity="0"/>
  </radialGradient>
  <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224" fill="url(#bgGlow)"/>

  <!-- ── Shield shape ──
       Centered at 512,512. Clean bezier shield.
  -->
  <g id="shield">

    <!-- Shield path — left half (darker) -->
    <path clip-path="url(#leftHalf)"
      d="M512,148
         C512,148 310,148 268,168
         C226,188 210,230 210,310
         C210,480 320,620 512,870
         Z"
      fill="url(#shieldLeft)"/>

    <!-- Shield path — right half (lighter) -->
    <path clip-path="url(#rightHalf)"
      d="M512,148
         C512,148 714,148 756,168
         C798,188 814,230 814,310
         C814,480 704,620 512,870
         Z"
      fill="url(#shieldRight)"/>

    <!-- Shield outline stroke — crisp single path -->
    <path
      d="M512,148
         C512,148 714,148 756,168
         C798,188 814,230 814,310
         C814,480 704,620 512,870
         C320,620 210,480 210,310
         C210,230 226,188 268,168
         C310,148 512,148 512,148
         Z"
      fill="none"
      stroke="url(#shieldStroke)"
      stroke-width="7"
      stroke-linejoin="round"/>

    <!-- Center divider line -->
    <line x1="512" y1="148" x2="512" y2="870"
      stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.18"
      clip-path="url(#bgClip)"/>

    <!-- Inner edge highlight top -->
    <path
      d="M512,148
         C512,148 714,148 756,168
         C798,188 814,230 814,310"
      fill="none"
      stroke="#ffffff"
      stroke-width="3.5"
      stroke-opacity="0.25"
      stroke-linecap="round"/>
    <path
      d="M512,148
         C512,148 310,148 268,168
         C226,188 210,230 210,310"
      fill="none"
      stroke="#ffffff"
      stroke-width="3.5"
      stroke-opacity="0.15"
      stroke-linecap="round"/>

  </g>

  <!-- ── Lock icon — centered in shield ── -->
  <g id="lock" filter="url(#lockShadow)">

    <!-- Lock body — rounded rect -->
    <rect x="386" y="506" width="252" height="210"
      rx="32" ry="32"
      fill="url(#lockGrad)"/>

    <!-- Lock body inner shadow top -->
    <rect x="386" y="506" width="252" height="50"
      rx="32" ry="32"
      fill="#ffffff" fill-opacity="0.12"/>

    <!-- Shackle (open/unlocked — right side up) -->
    <path
      d="M448,510
         L448,454
         C448,398 576,398 576,454
         L576,510"
      fill="none"
      stroke="url(#shackleGrad)"
      stroke-width="52"
      stroke-linecap="round"
      stroke-linejoin="round"/>

    <!-- Shackle inner dark -->
    <path
      d="M448,510
         L448,454
         C448,398 576,398 576,454
         L576,510"
      fill="none"
      stroke="#1a3fa8"
      stroke-width="26"
      stroke-linecap="round"
      stroke-linejoin="round"/>

    <!-- Keyhole circle -->
    <circle cx="512" cy="591" r="32" fill="#1e3fa0"/>

    <!-- Keyhole slot -->
    <rect x="496" y="591" width="32" height="50" rx="8" ry="8" fill="#1e3fa0"/>

  </g>

  <!-- ── Top gloss sheen ── -->
  <rect x="0" y="0" width="1024" height="420" rx="224" ry="224"
    fill="url(#gloss)" clip-path="url(#bgClip)"/>

  <!-- ── Bottom subtle vignette ── -->
  <radialGradient id="vignette" cx="50%" cy="100%" r="70%">
    <stop offset="0%" stop-color="#000000" stop-opacity="0.25"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
  </radialGradient>
  <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224"
    fill="url(#vignette)"/>

</svg>
