name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep -m1 'MARKETING_VERSION' TunnelGuard.xcodeproj/project.pbxproj | sed 's/.*= //' | sed 's/;.*//' | tr -d ' ')
          BUILD=$(grep -m1 'CURRENT_PROJECT_VERSION' TunnelGuard.xcodeproj/project.pbxproj | sed 's/.*= //' | sed 's/;.*//' | tr -d ' ')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build=$BUILD" >> $GITHUB_OUTPUT
          echo "TunnelGuard v$VERSION ($BUILD)"

      - name: Build Release
        run: |
          xcodebuild -project TunnelGuard.xcodeproj \
            -scheme TunnelGuard \
            -configuration Release \
            -derivedDataPath ./build \
            build

      - name: Create DMG
        run: |
          APP_PATH="./build/Build/Products/Release/TunnelGuard.app"
          mkdir -p /tmp/dmg-build dist
          cp -R "$APP_PATH" /tmp/dmg-build/
          ln -s /Applications /tmp/dmg-build/Applications
          hdiutil create \
            -volname "TunnelGuard v${{ steps.version.outputs.version }}" \
            -srcfolder /tmp/dmg-build \
            -ov -format UDZO \
            "dist/TunnelGuard-${{ steps.version.outputs.version }}.dmg"
          rm -rf /tmp/dmg-build

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: TunnelGuard-${{ steps.version.outputs.version }}
          path: dist/TunnelGuard-*.dmg

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep -m1 'MARKETING_VERSION' TunnelGuard.xcodeproj/project.pbxproj | sed 's/.*= //' | sed 's/;.*//' | tr -d ' ')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: TunnelGuard-${{ steps.version.outputs.version }}
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: TunnelGuard v${{ steps.version.outputs.version }}
          body_path: CHANGELOG.md
          files: dist/TunnelGuard-*.dmg
          draft: false
          prerelease: false
